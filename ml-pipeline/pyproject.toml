[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sahulat-ai-retrieval"
version = "0.1.0"
description = "Auditable visual and text product retrieval for Sahulat AI"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "Pillow==11.3.0", "PyYAML==6.0.2"]

[project.optional-dependencies]
ml = ["torch==2.10.0", "torchvision==0.25.0", "open_clip_torch==3.3.0", "transformers==4.57.6", "huggingface_hub==0.36.2", "safetensors==0.7.0"]
dev = ["pytest==8.4.2", "ruff==0.14.14", "mypy==1.19.1", "types-PyYAML==6.0.12.20250915"]
api = ["fastapi==0.141.1", "starlette==1.6.0", "pydantic==2.13.5", "uvicorn==0.52.4", "python-multipart==0.0.32"]
api-test = ["httpx==0.28.1"]

[project.scripts]
sahulat-visual = "sahulat_visual.cli:main"
sahulat-db-migrate = "sahulat_database.migrations_cli:main"
sahulat-db-verify = "sahulat_database.verification_cli:main"
sahulat-db-review = "sahulat_database.integrity_review_cli:main"
sahulat-import-khaadi = "sahulat_text.ingestion.khaadi_cli:main"
sahulat-build-product-text = "sahulat_text.documents.cli:main"
sahulat-ai-api = "sahulat_api.cli:main"
sahulat-voice-api = "sahulat_api.voice_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["unit: lightweight unit tests", "integration: local pipeline integration", "model: requires pretrained weights and ML dependencies", "slow: expensive execution", "database: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/sahulat_visual", "src/sahulat_text", "src/sahulat_database", "src/sahulat_api"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
